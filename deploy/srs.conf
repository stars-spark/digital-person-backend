# SRS 配置 —— 同时输出 HTTP-FLV（给 H5 app.html）与 HLS（给微信小程序 <video>）。
# LiveTalking 以 --transport rtmp 推流到本机 SRS，浏览器/小程序各取所需。
#
# 用法（一次性，用本 conf 重建容器）：
#   docker rm -f srs
#   docker run -d --name srs -p 1935:1935 -p 1985:1985 -p 8080:8080 \
#     -v /home/jiale/Desktop/Digital_Person/deploy/srs.conf:/usr/local/srs/conf/docker.conf \
#     registry.cn-hangzhou.aliyuncs.com/ossrs/srs:5 ./objs/srs -c conf/docker.conf
#
# 流地址（app=live, stream=livestream）：
#   FLV : http://<host>:8080/live/livestream.flv
#   HLS : http://<host>:8080/live/livestream.m3u8

listen              1935;
max_connections     200;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    # 关键：HLS/FLV 直播流加 CORS 头，浏览器跨源也能拉（小程序 native 无所谓，但 H5 需要）
    crossdomain     on;
}

rtc_server {
    enabled         off;
}

vhost __defaultVhost__ {
    # HTTP-FLV：低延迟，供 H5（mpegts.js）
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS：供微信个人号小程序 <video>（禁用 live-player 后唯一的直播路径）
    # hls_fragment 1 + hls_window 4 → 低延迟（~3-5s glass-to-glass），切片数少
    hls {
        enabled         on;
        hls_fragment    1;
        hls_window      4;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }
}
